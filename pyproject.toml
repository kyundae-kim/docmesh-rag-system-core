[project]
name = "rag-system-core"
version = "0.4.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dms-core>=0.10.0",
    "ollama>=0.6.2",
    "pydantic-settings>=2.14.1",
    "pymilvus[milvus-lite]>=3.0.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.setuptools.packages.find]
include = ["rag_system_core*"]
exclude = ["test_rag_system_core*"]

[tool.pytest.ini_options]
markers = [
    "integration: requires the devcontainer Ollama, MinIO, PostgreSQL, and Milvus services",
]
