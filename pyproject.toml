[project]
name = "rag-system-core"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dms",
    "docmesh-config",
    "docmesh-py-core",
    "pydantic-settings>=2.14.1",
    "pymilvus[milvus-lite]>=3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.setuptools.packages.find]
include = ["rag_system_core*"]
exclude = ["test_rag_system_core*"]

[tool.pytest.ini_options]
markers = [
    "integration: requires the devcontainer Ollama and MinIO services",
]

[tool.uv.sources]
docmesh-config = { git = "https://github.com/kyundae-kim/docmesh-config.git", rev = "v0.1.0" }
docmesh-py-core = { git = "https://github.com/kyundae-kim/docmesh-py-core.git", rev = "v0.6.0" }
dms = { git = "https://github.com/kyundae-kim/dms-core.git", rev = "v0.7.0" }
